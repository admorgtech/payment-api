name: PR Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build and Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify